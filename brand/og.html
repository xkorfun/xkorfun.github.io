<!doctype html>
<!-- The 1200×630 share image (img/og.png). Rendered by brand/make.sh; add new app icons to .apps. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: radial-gradient(900px 500px at 15% 0%, #2a3350 0%, #14161d 60%);
    color: #f5f5f7; font-family: -apple-system, "SF Pro Display", "Helvetica Neue", sans-serif;
    display: flex; flex-direction: column; justify-content: center; padding: 0 96px; box-sizing: border-box;
  }
  .brand { display: flex; align-items: center; gap: 28px; }
  .brand img { width: 150px; height: 150px; margin: -12px; }
  .brand b { font-size: 112px; letter-spacing: -.04em; font-weight: 800; }
  .brand b span { color: #4c9bff; }
  p { text-wrap: balance; font-size: 44px; line-height: 1.2; letter-spacing: -.015em; font-weight: 600; margin: 44px 0 0; max-width: 960px; }
  p small { display: block; font-size: 30px; font-weight: 500; color: #a1a1a6; margin-top: 14px; letter-spacing: 0; }
  .foot { display: flex; align-items: center; justify-content: space-between; margin-top: 52px; }
  .apps { display: flex; gap: 14px; }
  .apps img { width: 84px; height: 84px; margin: -6px; }
  .url { font-size: 28px; color: #a1a1a6; font-weight: 500; }
</style>
</head>
<body>
  <div class="brand"><img src="../img/xkorfun.png" alt=""><b>xkor<span>fun</span></b></div>
  <p>Small Mac apps for the little things macOS gets wrong.<small>macOS의 작은 불편을 고치는 작은 Mac 앱들. 무료, 오픈소스.</small></p>
  <div class="foot">
    <div class="apps"><img src="../img/dockpin.png" alt=""><img src="../img/winlego.png" alt=""></div>
    <div class="url">xkorfun.github.io</div>
  </div>
</body>
</html>
